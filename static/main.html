    <script>
        class AnalogMeter {
            constructor(element, options = {}) {
                this.element = element;
                this.needle = element.querySelector(".needle");

                this.min = options.min ?? 0;
                this.max = options.max ?? 100;
                this.unit = options.unit ?? "";

                this.value = this.min;

                this.element.querySelector(".meter-min").textContent = this.min;
                this.element.querySelector(".meter-max").textContent = this.max;
                this.element.querySelector(".meter-unit").textContent = this.unit;

                this.setValue(this.min);
            }

            setValue(value) {
                value = Number(value);

                if (!Number.isFinite(value)) {
                    return;
                }

                // 範囲制限
                value = Math.max(this.min, Math.min(this.max, value));

                this.value = value;

                // -90° ～ +90° に変換
                const ratio = (value - this.min) / (this.max - this.min);
                const angle = -90 + ratio * 180;

                this.needle.style.transformOrigin = "50% 82%"
                this.needle.style.transform = `rotate(${angle}deg)`;
            }

            getValue() {
                return this.value;
            }
        }
